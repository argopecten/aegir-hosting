hosting_client.settings:
  path: '/hosting/clients/settings'
  defaults:
    _form: '\Drupal\hosting_client\Form\HostingClientSettingsForm'
    _title: 'Client settings'
  requirements:
    _permission: 'administer clients'

hosting_client.autocomplete:
  path: '/hosting/clients/autocomplete'
  defaults:
    _controller: '\Drupal\hosting_client\Controller\HostingClientAutocompleteController::handle'
    _title: 'Client autocomplete'
  requirements:
    _permission: 'view client'
