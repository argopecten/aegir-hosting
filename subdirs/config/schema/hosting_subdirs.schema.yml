hosting_subdirs.settings:
  type: config_object
  label: 'Hosting Subdirectories settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable subdirectories support'
    max_depth:
      type: integer
      label: 'Maximum subdirectory depth'
    allowed_chars:
      type: string
      label: 'Allowed characters pattern'
    validate_uniqueness:
      type: boolean
      label: 'Validate subdirectory uniqueness'
    reserved_names:
      type: text
      label: 'Reserved subdirectory names'
