task:
  title: 'Tasks'
  description: 'API to provide support for tasks.'
  status: required
  module: hosting_task
  entity_type: hosting_task
  group: required
  role_permissions:
    'aegir platform manager':
      - 'administer tasks'
      - 'create lock task'
      - 'create unlock task'
      - 'create verify task'
      - 'access task logs'
      - 'cancel own tasks'
      - 'view own tasks'
      - 'retry failed tasks'
      - 'view task'
    'aegir client':
      - 'create backup task'
      - 'create delete task'
      - 'create disable task'
      - 'create enable task'
      - 'create restore task'
      - 'create verify task'
      - 'create login-reset task'
      - 'access task logs'
      - 'view own tasks'
      - 'view task'
      - 'cancel own tasks'
