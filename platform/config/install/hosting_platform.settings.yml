hosting_platform_base_path: '/var/aegir/platforms/'
hosting_platform_composer_cache_dir: '/var/aegir/.composer/cache'
hosting_platform_default_deployment_method: 'manual'
hosting_platform_composer_memory_limit: '2G'
hosting_platform_composer_timeout: 3600
hosting_platform_git_timeout: 1800
hosting_platform_validate_drupal: true
hosting_platform_require_composer_json: false
hosting_platform_check_disk_space: true
hosting_platform_min_disk_space: 500
hosting_platform_lock_by_default: false
hosting_platform_auto_unlock_after_verify: true
hosting_platform_automatic_site_import: true
hosting_platform_import_ignore_patterns: |
  default
  example.com
  template
hosting_platform_auto_verify_frequency: '0'
hosting_platform_cleanup_old_releases: false
hosting_platform_keep_releases: 3
hosting_platform_default_dir_mode: '0755'
hosting_platform_default_file_mode: '0644'
