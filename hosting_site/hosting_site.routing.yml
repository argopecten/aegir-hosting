hosting_site.task.verify:
  path: '/hosting/sites/{hosting_site}/verify'
  defaults:
    _form: '\Drupal\hosting_site\Form\SiteVerifyForm'
    _title: 'Verify site'
  requirements:
    _permission: 'administer sites'
    hosting_site: \d+

hosting_site.task.disable:
  path: '/hosting/sites/{hosting_site}/disable'
  defaults:
    _form: '\Drupal\hosting_site\Form\SiteDisableForm'
    _title: 'Disable site'
  requirements:
    _permission: 'administer sites'
    hosting_site: \d+

