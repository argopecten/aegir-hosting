services:
  hosting.task_manager:
    class: Drupal\hosting_task\Service\TaskManager
    arguments: ['@entity_type.manager', '@queue', '@datetime.time', '@logger.channel.hosting', '@hosting.backend_invoker', '@hosting.task_log_manager']

  hosting.task_log_manager:
    class: Drupal\hosting_task\Service\TaskLogManager
    arguments: ['@entity_type.manager', '@datetime.time']
