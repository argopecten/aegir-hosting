hosting_task.queue.dashboard:
  path: '/admin/hosting/tasks/queue'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskQueueController::dashboard'
    _title: 'Task Queue'
  requirements:
    _permission: 'administer tasks'

hosting_task.queue.refresh:
  path: '/admin/hosting/tasks/queue/refresh'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskQueueController::refresh'
  requirements:
    _permission: 'administer tasks'
  options:
    no_cache: TRUE

hosting_task.queue.cancel:
  path: '/admin/hosting/tasks/{task}/cancel'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskQueueController::cancel'
    _title: 'Cancel Task'
  requirements:
    _permission: 'administer tasks'
    task: \d+

hosting_task.queue.retry:
  path: '/admin/hosting/tasks/{task}/retry'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskQueueController::retry'
    _title: 'Retry Task'
  requirements:
    _permission: 'administer tasks'
    task: \d+

hosting_task.refresh.task_table:
  path: '/hosting/ajax/task-table/{entity_type_id}/{entity_id}'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskRefreshController::refreshTaskTable'
  requirements:
    _permission: 'access content'
    entity_id: \d+
  options:
    no_cache: TRUE

hosting_task.refresh.task_log:
  path: '/hosting/ajax/task-log/{hosting_task}'
  defaults:
    _controller: '\Drupal\hosting_task\Controller\TaskRefreshController::refreshTaskLog'
  requirements:
    _permission: 'access content'
    hosting_task: \d+
  options:
    no_cache: TRUE
